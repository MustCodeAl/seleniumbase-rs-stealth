# cargo-deny configuration: supply-chain gate for seleniumbase-rs-stealth.
#
# Modelled on the deny.toml of the core repository (seleniumbase-rs). Run locally with
# `cargo deny --all-features check`. Every exception below has to be written down and
# reviewed rather than silently tolerated.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# "warn" while `seleniumbase-rs` is depended on by git without a crates.io version.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The core library (`seleniumbase-rs`) and its transitive plugin API (`seleniumbase-rs-plugins`)
# come from their own repositories until published on crates.io.
allow-git = [
    "https://github.com/MustCodeAl/seleniumbase-rs",
    "https://github.com/MustCodeAl/seleniumbase-rs-plugins",
]
