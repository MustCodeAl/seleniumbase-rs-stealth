# GitLab CI for seleniumbase-rs-stealth, modelled on the one of seleniumbase-rs (core).
#
#   gate          fmt and clippy with `-D warnings` across every feature tier
#   test          unit and integration tests across every feature tier (Chrome tests are #[ignore]d)
#   supply-chain  cargo deny and cargo audit
#   h3d           MANUAL: the tests of the standalone HTTP/3 helper `h3d/`

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH =~ /^(lane|batch)\//'
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true
  retry:
    max: 1
    when: runner_system_failure

variables:
  RUST_VERSION: "1.100"
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

.rules_automatic:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: '$CI_COMMIT_BRANCH =~ /^(lane|batch)\//'
  - if: $CI_PIPELINE_SOURCE == "web"
    when: manual
    allow_failure: true

.rules_by_hand:
  - when: manual
    allow_failure: true

.rust:
  image: rust:${RUST_VERSION}-bookworm

.boringssl:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends cmake clang libclang-dev pkg-config
    - cmake --version
    - clang --version

.target_cache:
  cache:
    key:
      prefix: rust-target
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
    when: always
  after_script:
    - |
      [ -d target/debug ] || exit 0
      rm -rf target/doc target/debug/incremental target/debug/examples target/tmp
      find target/debug -maxdepth 1 -type f -delete
      find target/debug/deps -type f -perm /111 ! -name '*.so' -delete

gate:
  extends:
    - .rust
    - .boringssl
    - .target_cache
  rules:
    - !reference [.rules_automatic]
  timeout: 2h
  script:
    - rustc --version
    - cargo --version
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --no-default-features --all-targets -- -D warnings
    - cargo clippy --no-default-features --features client --all-targets -- -D warnings
    - cargo clippy --all-targets -- -D warnings
    - cargo clippy --features "http3 test-util test-fixtures" --all-targets -- -D warnings

test:
  extends:
    - .rust
    - .boringssl
    - .target_cache
  rules:
    - !reference [.rules_automatic]
  timeout: 2h
  script:
    - cargo test --no-default-features
    - cargo test --no-default-features --features client
    - cargo test --features "http3 test-util test-fixtures" --no-fail-fast

supply-chain:
  extends: .rust
  rules:
    - !reference [.rules_automatic]
  cache:
    key:
      prefix: supply-chain
      files:
        - Cargo.lock
    paths:
      - .cargo/bin/
      - .cargo/.crates.toml
      - .cargo/.crates2.json
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    when: always
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install --locked --version '^0.20' cargo-deny
    - cargo install --locked cargo-audit
    - cargo deny --all-features check
    - cargo audit

# MANUAL. `h3d/` is a standalone binary package (phantom-http builds its own BoringSSL).
h3d:
  extends:
    - .rust
    - .boringssl
  rules:
    - !reference [.rules_by_hand]
  timeout: 2h
  cache:
    key:
      prefix: h3d-target
      files:
        - h3d/Cargo.lock
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - h3d/target/
    when: always
  script:
    - cd h3d
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
