[package]
name = "seleniumbase-rs-impersonate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
seleniumbase-rs.workspace = true
seleniumbase-rs-wire.workspace = true
seleniumbase-rs-scrape.workspace = true
base64 = "0.23"
brotli = { version = "9", default-features = false, features = ["std"] }
btls = { version = "=0.5.6" }
bytes = "1.12"
chrono = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http = "1.5"
http-body-util = { version = "0.1.5" }
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "net", "io-util", "fs"] }
tokio-btls = { version = "=0.5.6" }
tracing = "0.1"
url = "2.5"
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["tokio-rt", "webpki-roots", "gzip", "deflate", "brotli", "zstd", "socks", "stream"] }

[dev-dependencies]
seleniumbase-rs = { workspace = true, features = ["test-util"] }
# The scripted browser launcher of `tests/stealth_session`.
async-trait = "0.1"
# The WebSocket client of `tests/impersonate_mitm/websocket.rs`.
tokio-tungstenite = "0.30"
tokio = { version = "1.53", features = ["test-util"] }
