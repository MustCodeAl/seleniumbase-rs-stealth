[package]
name = "seleniumbase-rs-scrape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
seleniumbase-rs.workspace = true
seleniumbase-rs-codec.workspace = true
async-trait = "0.1"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http = "1.5"
psl = { version = "2.1.241" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[dev-dependencies]
seleniumbase-rs = { workspace = true, features = ["test-util"] }
seleniumbase-rs-codec = { workspace = true, features = ["test-fixtures"] }
# Parses the pure modules in `tests/scrape_domain_purity.rs`.
syn = { version = "3", features = ["full", "visit"] }
tokio = { version = "1.53", features = ["test-util"] }
