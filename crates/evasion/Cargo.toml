[package]
name = "seleniumbase-rs-evasion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
test-util = []

[dependencies]
seleniumbase-rs = { workspace = true, features = ["plugins"] }
base64 = "0.23"
jiff = "0.2.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
seleniumbase-rs = { workspace = true, features = ["plugins", "test-util"] }
regex = "1"
schemars = "1.2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
unused_lifetimes = "warn"
