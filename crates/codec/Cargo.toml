[package]
name = "seleniumbase-rs-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The `ClientHello` byte builders of the tests (`client_hello::fixtures`), for the tests of the
# crates built on this one. Test support only: no release build turns it on.
test-fixtures = []

[dependencies]
seleniumbase-rs.workspace = true
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
seleniumbase-rs = { workspace = true, features = ["test-util"] }
