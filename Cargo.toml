[[test]]
name = "cdp_session_chrome"
required-features = ["session"]

[[test]]
name = "network_capture"
required-features = ["session", "test-fixtures"]

[[test]]
name = "network_capture_chrome"
required-features = ["session"]

[[test]]
name = "impersonate_capture_h2"
required-features = ["network", "test-fixtures"]

[[test]]
name = "impersonate_capture_h2_chrome"
required-features = ["network"]

[[test]]
name = "impersonate_http"
required-features = ["network", "test-fixtures"]

[[test]]
name = "impersonate_http_chrome"
required-features = ["network"]

[[test]]
name = "impersonate_mitm"
required-features = ["network", "test-fixtures"]

[[test]]
name = "impersonate_mitm_chrome"
required-features = ["network"]

[[test]]
name = "impersonate_wire"
required-features = ["network", "test-fixtures"]

[[test]]
name = "hybrid_session"
required-features = ["network", "test-fixtures"]

[[test]]
name = "hybrid_session_chrome"
required-features = ["network"]

# Runnable examples, gated cleanly by layer feature.
[[example]]
name = "cdp_session"
required-features = ["session"]

[[example]]
name = "capture_hints"
required-features = ["session"]

[[example]]
name = "capture_tls"
