[workspace]
resolver = "3"
members = ["crates/codec", "crates/scrape", "crates/mimic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/MustCodeAl/seleniumbase-rs-stealth"

[workspace.dependencies]
# The core crate from GitHub, spelled the way users write it (plain git URL), so
# Cargo resolves theirs and ours to one commit and types such as sb_cdp::Browser
# match. For a local checkout, patch this source in .cargo/config.toml (not committed).
seleniumbase-rs = { git = "https://github.com/MustCodeAl/seleniumbase-rs" }
seleniumbase-rs-codec = { path = "crates/codec" }
seleniumbase-rs-scrape = { path = "crates/scrape" }
seleniumbase-rs-mimic = { path = "crates/mimic" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
map_err_ignore = "warn"
semicolon_outside_block = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
