[package]
name = "http3-spike-client"
description = "Spike: phantom-http (HTTP/3) next to the stealth crates (wreq/btls) in one binary"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The HTTP/3 candidate, pinned to an exact version. `diagnostics` adds the key log and the qlog
# writer, which the capture step uses to cross-check what the server saw.
phantom = { package = "phantom-http", version = "=0.6.0", features = ["diagnostics"] }
# The stealth crates, by path: wreq 6.0.0-rc.31 over btls 0.5.6, the stack the repository ships.
seleniumbase-rs-mimic = { path = "../../../crates/mimic" }
seleniumbase-rs-codec = { path = "../../../crates/codec" }
# Same pin and features as the mimic crate, so the feature sets unify to one wreq build.
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["tokio-rt", "webpki-roots", "gzip", "deflate", "brotli", "zstd", "socks", "stream"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "fs"] }
